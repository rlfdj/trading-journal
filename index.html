<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Trading Journal</title>
  <meta name="description" content="Personal intraday futures trading journal.">
  <meta name="theme-color" content="#F4F5F2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0D0F12" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Journal">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="preload" href="fonts/InterTight-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/JetBrainsMono-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <main id="view" class="view" aria-live="polite"></main>

  <div id="overlay" class="overlay" hidden></div>

  <nav class="tabbar" aria-label="Main">
    <a class="tab" href="#/journal" data-tab="journal"><span data-icon="journal"></span>Journal</a>
    <a class="tab" href="#/calendar" data-tab="calendar"><span data-icon="calendar"></span>Calendar</a>
    <a class="tab-plus" href="#/trade/new" aria-label="Log a trade"><span data-icon="plus"></span></a>
    <a class="tab" href="#/stats" data-tab="stats"><span data-icon="stats"></span>Stats</a>
    <a class="tab" href="#/settings" data-tab="settings"><span data-icon="settings"></span>Settings</a>
  </nav>

  <noscript><p style="padding:24px">This app needs JavaScript.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
